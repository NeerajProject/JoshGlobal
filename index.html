<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JoshGlobe – Coming soon</title>
<meta name="description" content="JoshGlobe is launching soon.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sea:#0e2a47;
    --deep:#0a1f36;
    --line:#7fb7d6;
    --paper:#eaf1f4;
    --sun:#ffb627;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 90% at 70% 40%,var(--sea) 0%,var(--deep) 70%);
    color:var(--paper);
    font-family:"Instrument Sans",system-ui,sans-serif;
    line-height:1.6;
    overflow-x:hidden;
  }
  main{
    min-height:100%;
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);
    align-items:center;
    gap:2rem;
    max-width:1200px;
    margin:0 auto;
    padding:clamp(1.5rem,5vw,4rem);
  }
  .copy{max-width:34rem}
  .brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:500;font-size:1.1rem;color:var(--line);margin-bottom:2.5rem}
  h1{
    font-family:"Bricolage Grotesque",sans-serif;
    font-weight:800;
    font-size:clamp(3rem,8vw,5.6rem);
    line-height:.95;
    letter-spacing:-.03em;
    margin-bottom:1.5rem;
  }
  p.lede{font-size:1.15rem;color:#c5d8e3;margin-bottom:2rem;max-width:30rem}
  .notify{display:flex;gap:.6rem;flex-wrap:wrap}
  .notify input{
    flex:1 1 14rem;
    padding:.85rem 1rem;
    border-radius:.5rem;
    border:1.5px solid var(--line);
    background:transparent;
    color:var(--paper);
    font:inherit;
  }
  .notify input::placeholder{color:#8fb0c4}
  .notify button{
    padding:.85rem 1.4rem;
    border:0;border-radius:.5rem;
    background:var(--sun);color:var(--deep);
    font:inherit;font-weight:600;cursor:pointer;
  }
  .notify button:hover{background:#ffc652}
  :is(input,button,a):focus-visible{outline:3px solid var(--sun);outline-offset:2px}
  .msg{margin-top:.8rem;min-height:1.5rem;color:var(--sun);font-size:.95rem}
  footer{margin-top:3rem;font-size:.9rem;color:#8fb0c4}
  .globe-wrap{display:flex;justify-content:center}
  canvas{width:min(100%,560px);aspect-ratio:1;display:block}
  @media (max-width:820px){
    main{grid-template-columns:1fr;text-align:left}
    .globe-wrap{order:-1}
    canvas{width:min(80%,360px)}
  }
</style>
</head>
<body>
<main>
  <div class="copy">
    <div class="brand">JoshGlobe</div>
    <h1>The world is almost here.</h1>
    <p class="lede">We’re putting the finishing touches on JoshGlobe. Leave your email and we’ll tell you the day it opens.</p>

    <form class="notify" id="notify">
      <label for="email" hidden>Email address</label>
      <input id="email" type="email" required placeholder="you@example.com" autocomplete="email">
      <button type="submit">Notify me</button>
    </form>
    <p class="msg" id="msg" role="status"></p>

    <footer>© <span id="year"></span> JoshGlobe</footer>
  </div>

  <div class="globe-wrap">
    <canvas id="globe" width="1120" height="1120" role="img" aria-label="A slowly rotating globe drawn with latitude and longitude lines"></canvas>
  </div>
</main>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  /* ---- Notify form ----
     GitHub Pages is static, so there is no server to store emails.
     Option A (default): opens the visitor's email app addressed to you.
     Option B: replace the action below with a Formspree / Getform endpoint. */
  const OWNER_EMAIL = 'you@example.com'; // <- change this
  document.getElementById('notify').addEventListener('submit', e => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const subject = encodeURIComponent('Notify me when JoshGlobe launches');
    const body = encodeURIComponent('Please notify me at: ' + email);
    location.href = `mailto:${OWNER_EMAIL}?subject=${subject}&body=${body}`;
    document.getElementById('msg').textContent = 'Thanks! Send the email that just opened and you’re on the list.';
  });

  /* ---- Rotating globe ---- */
  const cv = document.getElementById('globe');
  const ctx = cv.getContext('2d');
  const W = cv.width, R = W * 0.42, C = W / 2;
  const tilt = 20 * Math.PI / 180;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const lines = [];
  for (let lon = 0; lon < 360; lon += 20) {
    const l = [];
    for (let lat = -90; lat <= 90; lat += 4) l.push([lon, lat]);
    lines.push(l);
  }
  for (let lat = -60; lat <= 60; lat += 20) {
    const l = [];
    for (let lon = 0; lon <= 360; lon += 4) l.push([lon, lat]);
    lines.push(l);
  }
  const pins = [[-74, 40.7], [2.3, 48.9], [139.7, 35.7], [151.2, -33.9], [-46.6, -23.5], [77.2, 28.6]];

  function proj(lon, lat, rot) {
    const p = lat * Math.PI / 180, l = (lon + rot) * Math.PI / 180;
    const x = Math.cos(p) * Math.sin(l), y = Math.sin(p), z = Math.cos(p) * Math.cos(l);
    return [x, y * Math.cos(tilt) - z * Math.sin(tilt), y * Math.sin(tilt) + z * Math.cos(tilt)];
  }

  function draw(rot, t) {
    ctx.clearRect(0, 0, W, W);
    // sphere body
    const g = ctx.createRadialGradient(C - R * .3, C - R * .3, R * .1, C, C, R);
    g.addColorStop(0, '#173f66'); g.addColorStop(1, '#0a2038');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(C, C, R, 0, 7); ctx.fill();

    ctx.lineWidth = 2;
    for (const l of lines) {
      let prev = null;
      for (const [lon, lat] of l) {
        const [x, y, z] = proj(lon, lat, rot);
        const pt = [C + x * R, C - y * R, z];
        if (prev) {
          const front = (pt[2] + prev[2]) / 2 > 0;
          ctx.strokeStyle = front ? 'rgba(127,183,214,.85)' : 'rgba(127,183,214,.12)';
          ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(pt[0], pt[1]); ctx.stroke();
        }
        prev = pt;
      }
    }
    // outline
    ctx.strokeStyle = '#7fb7d6'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(C, C, R, 0, 7); ctx.stroke();

    // pins
    pins.forEach(([lon, lat], i) => {
      const [x, y, z] = proj(lon, lat, rot);
      if (z <= 0.05) return;
      const px = C + x * R, py = C - y * R;
      const pulse = reduce ? 0 : ((t / 1200 + i * .3) % 1);
      ctx.fillStyle = '#ffb627';
      ctx.beginPath(); ctx.arc(px, py, 7, 0, 7); ctx.fill();
      ctx.strokeStyle = `rgba(255,182,39,${1 - pulse})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(px, py, 7 + pulse * 26, 0, 7); ctx.stroke();
    });
  }

  let rot = 0, last = 0;
  function frame(t) {
    if (!reduce) rot += (t - last) * 0.012;
    last = t;
    draw(rot, t);
    if (!reduce) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
